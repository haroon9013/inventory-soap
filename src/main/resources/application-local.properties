# ==============================================================================
# Local In-Memory Database Profile (for functional verification without AWS VPC)
# ==============================================================================
spring.application.name=inventory-soap
server.port=8080

# In-Memory Database configuration
spring.datasource.url=jdbc:h2:mem:inventorydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Supplier Microservice (Running locally on port 8081)
supplier.service.url=http://localhost:8081

# External Public APIs Configuration
frankfurter.api.url=https://api.frankfurter.dev/v1
openmeteo.api.url=https://api.open-meteo.com/v1/forecast
openmeteo.cache.duration.minutes=15

# Warehouse Location for Weather Monitoring
warehouse.location.name=Mumbai Central Distribution Hub
warehouse.location.latitude=19.0760
warehouse.location.longitude=72.8777
