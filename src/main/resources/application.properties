spring.application.name=inventory-soap
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Database Configuration (Supports Render PostgreSQL, AWS RDS, or custom DB_HOST / SPRING_DATASOURCE_URL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:inventory-db.c7mo0mo8y6tx.ap-south-1.rds.amazonaws.com}:${DB_PORT:5432}/${DB_NAME:inventorydb}?sslmode=require}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Independent Supplier Microservice URL
supplier.service.url=${SUPPLIER_SERVICE_URL:http://localhost:8081}

# External Public APIs Configuration
frankfurter.api.url=https://api.frankfurter.dev/v1
openmeteo.api.url=https://api.open-meteo.com/v1/forecast

# Warehouse Location for Weather Monitoring
warehouse.location.name=Mumbai Central Distribution Hub
warehouse.location.latitude=19.0760
warehouse.location.longitude=72.8777